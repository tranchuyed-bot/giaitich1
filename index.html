<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" id="themeColorMeta">
<title>Giải tích 1 · Mục lục thông minh</title>

<!-- PDF.js: render PDF bằng JS → nhảy trang chính xác trên mọi thiết bị kể cả iPhone -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
  (function () {
    try {
      var t = localStorage.getItem('giaotich1.viewer.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #d32f2f;
    --primary-2: #ff7043;
    --primary-soft: rgba(211, 47, 47, 0.1);
    --primary-glow: rgba(211, 47, 47, 0.35);
    --green: #10b981;
    --green-2: #34d399;
    --green-soft: rgba(16, 185, 129, 0.12);

    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --surface-3: #eef2f8;
    --text: #1a2333;
    --text-soft: #475569;
    --muted: #94a3b8;
    --border: #e2e8f0;
    --border-2: #cbd5e1;
    --mark: rgba(255, 213, 0, 0.45);
    --canvas-bg: #525659;

    --sidebar-w: 340px;
    --header-h: 56px;

    --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 16px 40px -12px rgba(15, 23, 42, 0.18);

    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --spring: cubic-bezier(0.34, 1.4, 0.5, 1);
  }

  [data-theme="dark"] {
    --primary: #ff5c5c;
    --primary-2: #ff9a6b;
    --primary-soft: rgba(255, 92, 92, 0.14);
    --primary-glow: rgba(255, 92, 92, 0.4);
    --green: #34d399;
    --green-2: #6ee7b7;
    --green-soft: rgba(52, 211, 153, 0.15);
    --bg: #0a0e17;
    --surface: #131826;
    --surface-2: #1a2133;
    --surface-3: #202a40;
    --text: #e8eefb;
    --text-soft: #b8c4db;
    --muted: #8595b0;
    --border: #232c42;
    --border-2: #33405c;
    --mark: rgba(255, 213, 0, 0.35);
    --canvas-bg: #1a1a1a;
    --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 16px 40px -12px rgba(0, 0, 0, 0.6);
  }

  html { height: 100%; }

  body {
    margin: 0;
    height: 100%;
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  button { font-family: inherit; touch-action: manipulation; }
  a { color: inherit; text-decoration: none; }

  .app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    flex: 0 0 var(--sidebar-w);
    width: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    z-index: 20;
  }

  .sidebar-head {
    flex-shrink: 0;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }

  .brand-logo {
    flex: 0 0 40px;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 11px;
    font-size: 21px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 6px 16px -6px var(--primary-glow);
  }

  .brand-text { flex: 1; min-width: 0; }
  .brand-title { font-size: 15px; font-weight: 800; line-height: 1.15; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .icon-btn {
    flex: 0 0 38px;
    width: 38px; height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-soft);
    cursor: pointer;
    transition: all .15s var(--ease);
  }
  .icon-btn:active { background: var(--surface-3); transform: scale(0.94); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:disabled { opacity: 0.35; }

  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-icon {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    width: 15px; height: 15px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 2;
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    height: 38px;
    padding: 0 10px 0 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 16px; /* iOS: không tự zoom */
    outline: none;
    -webkit-appearance: none;
    transition: border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  }
  #searchInput::placeholder { color: var(--muted); font-size: 13px; }
  #searchInput:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-soft); }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 11.5px;
    color: var(--text-soft);
    font-weight: 600;
  }
  .progress-count { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }

  .progress-track { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--green), var(--green-2));
    transition: width .4s var(--ease);
  }

  .actions-row { display: flex; gap: 6px; margin-top: 10px; }
  .action-btn {
    flex: 1;
    min-height: 32px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text-soft);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s var(--ease);
  }
  .action-btn:active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

  /* ===== TOC ===== */
  .toc-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 8px 8px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .toc-scroll::-webkit-scrollbar { width: 5px; }
  .toc-scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

  .toc-scroll.searching.empty::after {
    content: 'Không tìm thấy mục nào.';
    display: block;
    padding: 28px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }

  .chapter { margin-bottom: 2px; }

  .chapter-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    padding: 10px 12px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    user-select: none;
  }
  .chapter-head:active { background: var(--surface-2); }

  .chevron {
    flex: 0 0 14px; width: 14px; height: 14px;
    fill: none; stroke: var(--muted); stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round;
    transition: transform .25s var(--ease);
  }
  .chapter.collapsed .chevron { transform: rotate(-90deg); }

  .chapter-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chapter-count {
    flex: 0 0 auto;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--surface-3);
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .chapter-count.complete { background: var(--green-soft); color: var(--green); }

  .chapter-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .28s var(--ease);
  }
  .chapter.collapsed .chapter-body { grid-template-rows: 0fr; }
  .chapter-body-inner { overflow: hidden; min-height: 0; }

  .section-list { list-style: none; margin: 0; padding: 0 0 4px 6px; }

  .section-item {
    display: flex;
    align-items: stretch;
    margin: 1px 0;
    border-radius: 8px;
    transition: background .15s var(--ease);
  }
  .section-item.active { background: var(--primary-soft); }

  .section-link {
    flex: 1;
    min-width: 0;
    min-height: 46px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 6px 10px 10px;
    color: var(--text-soft);
    font-size: 13px;
    line-height: 1.35;
    border-radius: 8px 0 0 8px;
    cursor: pointer;
    user-select: none;
    transition: color .15s var(--ease);
  }
  .section-link:active { background: var(--surface-3); }
  .section-item.active .section-link { color: var(--primary); font-weight: 600; }

  .section-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .section-page {
    flex: 0 0 auto;
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--surface-3);
  }
  .section-item.active .section-page { background: var(--primary); color: #fff; }

  .complete-btn {
    flex: 0 0 48px;
    width: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 2px 2px 2px 0;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
  }
  .complete-btn:active { background: var(--surface-3); }

  .check-box {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: 7px;
    border: 2px solid var(--border-2);
    background: transparent;
    transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--spring);
  }
  .check-box svg {
    width: 14px; height: 14px;
    fill: none; stroke: #fff; stroke-width: 3.6;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 26; stroke-dashoffset: 26;
    transition: stroke-dashoffset .25s ease .04s;
  }
  .section-item.completed .check-box {
    background: linear-gradient(135deg, var(--green), var(--green-2));
    border-color: transparent;
    transform: scale(1.02);
  }
  .section-item.completed .check-box svg { stroke-dashoffset: 0; }
  .section-item.completed .section-link { color: var(--muted); }
  .section-item.completed .section-title { text-decoration: line-through; text-decoration-color: var(--muted); text-decoration-thickness: 1.5px; }
  .section-item.completed .section-page { opacity: .6; }

  mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }

  /* ===== PDF VIEWER ===== */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100%;
  }

  .pdf-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    min-height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
    padding-right: calc(10px + env(safe-area-inset-right, 0px));
  }

  .back-btn {
    display: none;
    flex: 0 0 40px;
    width: 40px; height: 40px;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-soft);
    cursor: pointer;
  }
  .back-btn:active { background: var(--surface-3); }
  .back-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .nav-btn {
    flex: 0 0 38px;
    width: 38px; height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-soft);
    cursor: pointer;
    transition: all .15s var(--ease);
  }
  .nav-btn:active:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .nav-btn:disabled { opacity: 0.3; }
  .nav-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .title-block { flex: 1; min-width: 0; padding: 0 4px; }
  .title-kicker {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title-main {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .pdf-check-btn {
    flex: 0 0 40px;
    width: 40px; height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all .2s var(--ease);
  }
  .pdf-check-btn:active { transform: scale(0.94); }
  .pdf-check-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .pdf-check-btn.is-done {
    background: linear-gradient(135deg, var(--green), var(--green-2));
    border-color: transparent;
    color: #fff;
  }

  .open-ext-btn {
    flex: 0 0 40px;
    width: 40px; height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-soft);
    cursor: pointer;
  }
  .open-ext-btn:active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .open-ext-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .pdf-body {
    flex: 1;
    position: relative;
    background: var(--canvas-bg);
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  #pdfCanvas {
    display: block;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    max-width: 100%;
  }

  .pdf-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    color: #e2e8f0;
    text-align: center;
    font-size: 13px;
  }
  .pdf-empty svg { width: 48px; height: 48px; fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .6; }
  .pdf-empty p { margin: 0; max-width: 280px; line-height: 1.5; }

  .pdf-loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--surface);
    color: var(--text-soft);
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s var(--ease), visibility .2s var(--ease);
    z-index: 5;
  }
  .pdf-loading-overlay.active { opacity: 1; visibility: visible; }

  .spinner {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid var(--border-2);
    border-top-color: var(--primary);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pdf-error {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    background: var(--surface);
    text-align: center;
    z-index: 6;
  }
  .pdf-error.show { display: flex; }
  .pdf-error-icon {
    width: 56px; height: 56px;
    display: grid; place-items: center;
    border-radius: 16px;
    background: var(--primary-soft);
    color: var(--primary);
  }
  .pdf-error-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .pdf-error h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text); }
  .pdf-error p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; max-width: 320px; }
  .pdf-error-btn {
    padding: 10px 20px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px -8px var(--primary-glow);
  }
  .pdf-error-btn:active { transform: scale(0.96); }

  .page-indicator {
    position: absolute;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s var(--ease);
    z-index: 4;
  }
  .page-indicator.show { opacity: 1; }

  .icon-sun { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }

  /* ===== MOBILE ===== */
  @media (max-width: 860px) {
    .app { display: block; position: relative; }

    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 100%;
      max-width: 100%;
      height: 100dvh;
      border-right: 0;
      z-index: 20;
      transform: translateX(0);
      transition: transform .34s var(--ease);
      will-change: transform;
    }

    .content {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100dvh;
      transform: translateX(100%);
      transition: transform .34s var(--ease);
      will-change: transform;
      box-shadow: -12px 0 32px rgba(0, 0, 0, 0.18);
      z-index: 30;
      background: var(--surface);
    }

    .app.pdf-open .content { transform: translateX(0); }

    .back-btn { display: inline-flex; }
    .pdf-check-btn { display: inline-flex; }

    .nav-btn { width: 42px; height: 42px; flex-basis: 42px; }
    .back-btn { width: 42px; height: 42px; flex-basis: 42px; }
    .pdf-check-btn { width: 42px; height: 42px; flex-basis: 42px; }
    .open-ext-btn { width: 42px; height: 42px; flex-basis: 42px; }
  }

  @media (min-width: 861px) {
    .pdf-check-btn { display: none; }
    .pdf-empty-mobile { display: none; }
  }

  @media (max-width: 380px) {
    .sidebar-head { padding: 12px 12px 10px; }
    .brand-title { font-size: 14px; }
    .brand-logo { width: 36px; height: 36px; font-size: 19px; }
    .section-link { font-size: 12.5px; padding: 9px 4px 9px 8px; }
    .section-page { font-size: 10px; padding: 1px 5px; }
    .title-main { font-size: 12.5px; }
    .title-kicker { font-size: 9.5px; }
    .pdf-head { gap: 4px; padding: 6px 8px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
    .nav-btn, .back-btn, .pdf-check-btn, .open-ext-btn {
      width: 38px; height: 38px; flex-basis: 38px;
    }
  }

  @media (max-height: 480px) and (orientation: landscape) {
    .sidebar-head { padding-top: 8px; padding-bottom: 8px; }
    .brand-row { margin-bottom: 8px; }
    .brand-logo { width: 32px; height: 32px; font-size: 17px; border-radius: 9px; }
    .brand-sub { display: none; }
    .actions-row { display: none; }
    .search-wrap { margin-bottom: 6px; }
    #searchInput { height: 34px; font-size: 15px; }
  }

  @media (hover: hover) {
    .chapter-head:hover { background: var(--surface-2); }
    .section-item:hover { background: var(--surface-2); }
    .icon-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .action-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<noscript>
  <div style="position:fixed;inset:0;display:grid;place-items:center;background:#f4f6fa;padding:20px;text-align:center;font-family:sans-serif;z-index:9999;">

</noscript>

<div class="app" id="app">

  <!-- ===== SIDEBAR / TOC ===== -->
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-head">
      <div class="brand-row">
        <div class="brand-logo" aria-hidden="true">∫</div>
        <div class="brand-text">

        </div>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Đổi giao diện">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.5 8.5 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
        </button>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Tìm mục..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      </div>

      <div class="progress-row">
        <span>Đã học xong</span>
        <span class="progress-count" id="doneText">0/0</span>

      <div class="progress-track"><div class="progress-fill" id="doneBar"></div></div>

      <div class="actions-row">
        <button class="action-btn" id="expandAll" type="button">Mở tất cả</button>
        <button class="action-btn" id="collapseAll" type="button">Thu gọn</button>
      </div>
    </header>

    <nav class="toc-scroll" id="tocScroll" aria-label="Mục lục"></nav>
  </aside>

  <!-- ===== PDF VIEWER ===== -->
  <main class="content" id="content">

    <header class="pdf-head">
      <button class="back-btn" id="backBtn" type="button" aria-label="Quay lại mục lục">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>

      <button class="nav-btn" id="prevBtn" type="button" aria-label="Trang trước" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>

      <div class="title-block">
        <div class="title-kicker" id="currentKicker">Bắt đầu</div>
        <div class="title-main" id="currentTitle">Chọn một mục</div>
      </div>

      <button class="nav-btn" id="nextBtn" type="button" aria-label="Trang tiếp" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <button class="pdf-check-btn" id="pdfCheckBtn" type="button" aria-pressed="false" aria-label="Đánh dấu đã học">
        <svg viewBox="0 0 24 24"><path d="M4 12.6l5.2 5.2L20 6.6"/></svg>
      </button>

      <a class="open-ext-btn" id="openExtBtn" href="#" target="_blank" rel="noopener" aria-label="Mở bằng ứng dụng xem PDF">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>
      </a>
    </header>

    <div class="pdf-body" id="pdfBody">
      <canvas id="pdfCanvas"></canvas>

      <div class="pdf-empty" id="pdfEmpty">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h2"/></svg>
        <p>Chọn một mục ở cột bên trái<br>để mở đúng trang PDF.</p>
      </div>

      <div class="pdf-loading-overlay" id="pdfLoading">
        <div class="spinner"></div>
        <span id="loadingText">Đang tải PDF...</span>
      </div>

      <div class="pdf-error" id="pdfError">
        <div class="pdf-error-icon">
          <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
        </div>
        <h3>Không thể tải PDF trong ứng dụng</h3>
        <p id="pdfErrorMsg">Có thể do trình duyệt chặn tải file khi mở trực tiếp. Hãy thử mở bằng ứng dụng xem PDF bên ngoài.</p>
        <button class="pdf-error-btn" id="pdfErrorBtn" type="button">Mở bằng ứng dụng khác</button>
      </div>

      <div class="page-indicator" id="pageIndicator">Trang 1</div>
    </div>
  </main>

</div>

<script>
(function () {
  'use strict';

  /* ============ CẤU HÌNH ============ */
  const PDF_FILE = 'Giải tích hàm một biến số (Giải tích 1) - 2013_2.pdf';
  const PDF_URL = encodeURI(PDF_FILE);

  const TOC = [
    { title: 'Chương 1. Số phức và giới hạn', sections: [
      { title: '1.1. Số thực', page: 8 },
      { title: '1.2. Số phức', page: 11 },
      { title: '1.3. Dãy số thực', page: 22 }
    ]},
    { title: 'Chương 2. Phép tính vi phân', sections: [
      { title: '2.1. Các khái niệm cơ bản', page: 44 },
      { title: '2.2. Giới hạn của hàm số', page: 49 },
      { title: '2.3. ĐL Vô cùng bé & Vô cùng lớn', page: 56 },
      { title: '2.4. Hàm số liên tục', page: 57 },
      { title: '2.5. Hàm liên tục đều', page: 62 },
      { title: '2.6. Đạo hàm', page: 65 },
      { title: '2.7. Vi phân của hàm số', page: 68 },
      { title: '2.8. Đạo hàm và vi phân cấp cao', page: 68 },
      { title: '2.9. Công thức Taylor', page: 76 },
      { title: "2.10. Quy tắc L'Hospital", page: 80 },
      { title: '2.11. Hàm lồi', page: 82 }
    ]},
    { title: 'Chương 3. Phép tính tích phân', sections: [
      { title: '3.1. Tích phân xác định', page: 96 },
      { title: '3.2. Tính chất', page: 102 },
      { title: '3.3. Nguyên hàm và TP xác định', page: 104 },
      { title: '3.4. Các phương pháp tính', page: 107 },
      { title: '3.5. Tích phân hàm phân thức hữu tỷ', page: 111 },
      { title: '3.6. Tích phân hàm lượng giác', page: 114 },
      { title: '3.7. Một vài ứng dụng', page: 117 },
      { title: '3.8. Tích phân suy rộng cận vô hạn', page: 127 },
      { title: '3.9. Tích phân suy rộng cận hữu hạn', page: 133 }
    ]},
    { title: 'Chương 4. Chuỗi số và chuỗi hàm', sections: [
      { title: '4.1. Chuỗi số', page: 146 },
      { title: '4.2. Chuỗi số dương', page: 149 },
      { title: '4.3. Chuỗi đan dấu', page: 154 },
      { title: '4.4. Chuỗi hàm', page: 156 },
      { title: '4.5. Chuỗi lũy thừa', page: 164 },
      { title: '4.6. Chuỗi Fourier', page: 171 }
    ]}
  ];

  /* ============ PDF.JS SETUP ============ */
  const PDFJS_VERSION = '3.11.174';
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/build/pdf.worker.min.js';
  }

  /* ============ FLATTEN ============ */
  const FLAT = [];
  const BY_ID = {};
  TOC.forEach(function (ch, ci) {
    ch.sections.forEach(function (s, si) {
      const id = 's-' + ci + '-' + si;
      const item = { id, title: s.title, page: s.page, chapterIdx: ci, sectionIdx: si };
      FLAT.push(item);
      BY_ID[id] = item;
    });
  });

  /* ============ STORAGE ============ */
  const KEY_THEME = 'giaotich1.viewer.theme';
  const KEY_DONE = 'giaotich1.viewer.done';
  const KEY_LAST = 'giaotich1.viewer.last';
  const KEY_COLLAPSED = 'giaotich1.viewer.collapsed';

  /* ============ STATE ============ */
  let activeId = null;
  let completed = new Set();
  let collapsed = new Set();
  let filteredQuery = '';
  let isMobile = window.matchMedia('(max-width: 860px)').matches;

  /* PDF state */
  let pdfDoc = null;
  let pdfLoadingPromise = null;
  let currentPageNum = 0;
  let currentRenderTask = null;
  let isRendering = false;
  let pendingRender = null;
  let lastRenderedScale = 1;

  /* ============ ELEMENTS ============ */
  const app           = document.getElementById('app');
  const sidebar       = document.getElementById('sidebar');
  const tocScroll     = document.getElementById('tocScroll');
  const searchInput   = document.getElementById('searchInput');
  const pdfBody       = document.getElementById('pdfBody');
  const pdfCanvas     = document.getElementById('pdfCanvas');
  const pdfEmpty      = document.getElementById('pdfEmpty');
  const pdfLoading    = document.getElementById('pdfLoading');
  const loadingText   = document.getElementById('loadingText');
  const pdfError      = document.getElementById('pdfError');
  const pdfErrorMsg   = document.getElementById('pdfErrorMsg');
  const pdfErrorBtn   = document.getElementById('pdfErrorBtn');
  const pageIndicator = document.getElementById('pageIndicator');
  const currentKicker = document.getElementById('currentKicker');
  const currentTitle  = document.getElementById('currentTitle');
  const prevBtn       = document.getElementById('prevBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const backBtn       = document.getElementById('backBtn');
  const pdfCheckBtn   = document.getElementById('pdfCheckBtn');
  const openExtBtn    = document.getElementById('openExtBtn');
  const themeToggle   = document.getElementById('themeToggle');
  const themeColorMeta= document.getElementById('themeColorMeta');
  const expandAllBtn  = document.getElementById('expandAll');
  const collapseAllBtn= document.getElementById('collapseAll');
  const doneBar       = document.getElementById('doneBar');
  const doneText      = document.getElementById('doneText');

  /* ============ HELPERS ============ */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function highlightMatch(text, query) {
    if (!query) return escapeHtml(text);
    const lower = text.toLowerCase();
    const qLower = query.toLowerCase();
    let result = '';
    let i = 0;
    while (true) {
      const idx = lower.indexOf(qLower, i);
      if (idx === -1) { result += escapeHtml(text.slice(i)); break; }
      result += escapeHtml(text.slice(i, idx));
      result += '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>';
      i = idx + query.length;
    }
    return result;
  }

  /* ============ BUILD TOC ============ */
  function buildTOC() {
    tocScroll.innerHTML = TOC.map(function (ch, ci) {
      const sectionsHtml = ch.sections.map(function (s, si) {
        const id = 's-' + ci + '-' + si;
        return '<li class="section-item" data-id="' + id + '">' +
          '<a class="section-link" data-page="' + s.page + '">' +
            '<span class="section-title">' + escapeHtml(s.title) + '</span>' +
            '<span class="section-page">tr. ' + s.page + '</span>' +
          '</a>' +
          '<button class="complete-btn" type="button" aria-pressed="false" aria-label="Đánh dấu hoàn thành: ' + escapeHtml(s.title) + '">' +
            '<span class="check-box" aria-hidden="true">' +
              '<svg viewBox="0 0 24 24"><path d="M4 12.6l5.2 5.2L20 6.6"/></svg>' +
            '</span>' +
          '</button>' +
        '</li>';
      }).join('');

      return '<div class="chapter" data-chapter-idx="' + ci + '">' +
        '<button class="chapter-head" type="button" aria-expanded="true">' +
          '<svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
          '<span class="chapter-title">' + escapeHtml(ch.title) + '</span>' +
          '<span class="chapter-count">0/' + ch.sections.length + '</span>' +
        '</button>' +
        '<div class="chapter-body"><div class="chapter-body-inner">' +
          '<ul class="section-list">' + sectionsHtml + '</ul>' +
        '</div></div>' +
      '</div>';
    }).join('');
  }

  /* ============ LOAD STATE ============ */
  function loadState() {
    try {
      const arr = JSON.parse(localStorage.getItem(KEY_DONE) || '[]');
      completed = new Set(arr.filter(function (id) { return BY_ID[id]; }));
    } catch (e) { completed = new Set(); }

    try {
      const arr = JSON.parse(localStorage.getItem(KEY_COLLAPSED) || '[]');
      collapsed = new Set(arr.filter(function (i) { return Number.isInteger(i); }));
    } catch (e) { collapsed = new Set(); }

    tocScroll.querySelectorAll('.chapter').forEach(function (chEl) {
      const idx = Number(chEl.dataset.chapterIdx);
      if (collapsed.has(idx)) {
        chEl.classList.add('collapsed');
        chEl.querySelector('.chapter-head').setAttribute('aria-expanded', 'false');
      }
    });

    applyCompletedState();
  }

  function saveDone() {
    try { localStorage.setItem(KEY_DONE, JSON.stringify(Array.from(completed))); } catch (e) {}
  }
  function saveCollapsed() {
    try { localStorage.setItem(KEY_COLLAPSED, JSON.stringify(Array.from(collapsed))); } catch (e) {}
  }
  function saveLast() {
    try { if (activeId) localStorage.setItem(KEY_LAST, activeId); } catch (e) {}
  }

  /* ============ COMPLETED ============ */
  function applyCompletedState() {
    tocScroll.querySelectorAll('.section-item').forEach(function (item) {
      const isDone = completed.has(item.dataset.id);
      item.classList.toggle('completed', isDone);
      const btn = item.querySelector('.complete-btn');
      btn.setAttribute('aria-pressed', isDone ? 'true' : 'false');
    });
    updateProgressUI();
    updatePdfCheckBtn();
  }

  function updateProgressUI() {
    tocScroll.querySelectorAll('.chapter').forEach(function (chEl) {
      const idx = Number(chEl.dataset.chapterIdx);
      const ch = TOC[idx];
      let count = 0;
      ch.sections.forEach(function (_, si) {
        if (completed.has('s-' + idx + '-' + si)) count++;
      });
      const badge = chEl.querySelector('.chapter-count');
      badge.textContent = count + '/' + ch.sections.length;
      badge.classList.toggle('complete', count === ch.sections.length);
    });

    const total = FLAT.length;
    const count = completed.size;
    const pct = total ? (count / total * 100) : 0;
    doneBar.style.width = pct + '%';
    doneText.textContent = count + '/' + total;
  }

  function toggleComplete(id) {
    const item = tocScroll.querySelector('.section-item[data-id="' + id + '"]');
    if (!item) return;

    if (completed.has(id)) {
      completed.delete(id);
      item.classList.remove('completed');
    } else {
      completed.add(id);
      item.classList.add('completed');
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    }

    const btn = item.querySelector('.complete-btn');
    btn.setAttribute('aria-pressed', completed.has(id) ? 'true' : 'false');

    saveDone();
    updateProgressUI();
    updatePdfCheckBtn();
  }

  function updatePdfCheckBtn() {
    if (!activeId) {
      pdfCheckBtn.classList.remove('is-done');
      pdfCheckBtn.setAttribute('aria-pressed', 'false');
      return;
    }
    const isDone = completed.has(activeId);
    pdfCheckBtn.classList.toggle('is-done', isDone);
    pdfCheckBtn.setAttribute('aria-pressed', isDone ? 'true' : 'false');
  }

  /* ============ PDF LOADING ============ */
  function ensurePdfLoaded() {
    if (pdfDoc) return Promise.resolve(pdfDoc);
    if (pdfLoadingPromise) return pdfLoadingPromise;

    if (typeof pdfjsLib === 'undefined') {
      return Promise.reject(new Error('PDF.js chưa tải xong. Kiểm tra kết nối mạng.'));
    }

    pdfLoadingPromise = pdfjsLib.getDocument({
      url: PDF_URL,
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@' + PDFJS_VERSION + '/cmaps/',
      cMapPacked: true
    }).promise.then(function (doc) {
      pdfDoc = doc;
      return doc;
    }).catch(function (err) {
      pdfLoadingPromise = null;
      throw err;
    });

    return pdfLoadingPromise;
  }

  /* ============ PDF RENDER ============ */
  function showLoading(text) {
    loadingText.textContent = text || 'Đang tải PDF...';
    pdfLoading.classList.add('active');
  }
  function hideLoading() {
    pdfLoading.classList.remove('active');
  }
  function showError(msg) {
    pdfErrorMsg.textContent = msg || 'Có lỗi xảy ra khi mở PDF.';
    pdfError.classList.add('show');
    hideLoading();
    pdfEmpty.style.display = 'none';
    pdfCanvas.style.display = 'none';
  }
  function hideError() {
    pdfError.classList.remove('show');
    pdfCanvas.style.display = '';
  }

  async function renderPage(pageNum, opts) {
    opts = opts || {};

    // Nếu đang render, ghi nhớ page cuối để render tiếp
    if (isRendering) {
      pendingRender = pageNum;
      return;
    }

    isRendering = true;
    hideError();

    try {
      const pdf = await ensurePdfLoaded();

      // Clamp
      const clampedPage = Math.max(1, Math.min(pageNum, pdf.numPages));

      if (!opts.silent) {
        showLoading('Đang mở trang ' + clampedPage + '...');
      }

      const page = await pdf.getPage(clampedPage);

      // Tính scale để fit chiều rộng khung
      const containerW = pdfBody.clientWidth - 16;
      const baseViewport = page.getViewport({ scale: 1 });
      const fitScale = Math.max(0.3, containerW / baseViewport.width);
      const viewport = page.getViewport({ scale: fitScale });

      // Retina nhưng cap 2x cho hiệu năng
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const cssW = viewport.width;
      const cssH = viewport.height;

      pdfCanvas.width = Math.floor(cssW * dpr);
      pdfCanvas.height = Math.floor(cssH * dpr);
      pdfCanvas.style.width = cssW + 'px';
      pdfCanvas.style.height = cssH + 'px';

      const ctx = pdfCanvas.getContext('2d', { alpha: false });
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Hủy render cũ nếu có
      if (currentRenderTask) {
        try { currentRenderTask.cancel(); } catch (e) {}
        currentRenderTask = null;
      }

      currentRenderTask = page.render({ canvasContext: ctx, viewport: viewport });
      await currentRenderTask.promise;
      currentRenderTask = null;

      currentPageNum = clampedPage;
      lastRenderedScale = fitScale;

      pdfEmpty.style.display = 'none';
      pdfCanvas.style.display = 'block';

      updatePageIndicator(clampedPage, pdf.numPages);
      updateNavButtonsForPage(clampedPage, pdf.numPages);

      // Scroll về đầu trang khi đổi trang
      if (opts.scrollTop !== false) {
        pdfBody.scrollTop = 0;
      }

      hideLoading();
    } catch (err) {
      if (err && (err.name === 'RenderingCancelledException' || /cancel/i.test(err.message || ''))) {
        hideLoading();
      } else {
        console.error('Render error:', err);
        showError(err && err.message ? 'Lỗi: ' + err.message : 'Không thể tải PDF.');
      }
    } finally {
      isRendering = false;

      if (pendingRender !== null) {
        const p = pendingRender;
        pendingRender = null;
        renderPage(p, { silent: false });
      }
    }
  }

  function updatePageIndicator(page, total) {
    pageIndicator.textContent = 'Trang ' + page + ' / ' + total;
    pageIndicator.classList.add('show');
    clearTimeout(updatePageIndicator._timer);
    updatePageIndicator._timer = setTimeout(function () {
      pageIndicator.classList.remove('show');
    }, 1800);
  }

  function updateNavButtonsForPage(page, total) {
    prevBtn.disabled = page <= 1;
    nextBtn.disabled = page >= total;
  }

  /* ============ NAVIGATE ============ */
  function updateActiveUI() {
    tocScroll.querySelectorAll('.section-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.id === activeId);
    });
    updatePdfCheckBtn();
  }

  function updateTopbar(sec) {
    if (!sec) return;
    currentKicker.textContent = 'Chương ' + (sec.chapterIdx + 1) + ' · Trang ' + sec.page;
    currentTitle.textContent = sec.title;
    openExtBtn.href = PDF_URL + '#page=' + sec.page;
  }

  function scrollActiveIntoView() {
    if (!activeId) return;
    const el = tocScroll.querySelector('.section-item[data-id="' + activeId + '"]');
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function openPdfView() {
    if (isMobile) app.classList.add('pdf-open');
  }
  function closePdfView() {
    app.classList.remove('pdf-open');
  }

  function navigateTo(id, opts) {
    opts = opts || {};
    const sec = BY_ID[id];
    if (!sec) return;

    activeId = id;
    updateActiveUI();
    updateTopbar(sec);
    saveLast();

    const wasCollapsed = collapsed.has(sec.chapterIdx);
    if (wasCollapsed) toggleChapter(sec.chapterIdx, 'open');

    // Render PDF đúng trang
    renderPage(sec.page);

    // Mở PDF view trên mobile
    if (isMobile) openPdfView();

    if (opts.scroll !== false) {
      if (wasCollapsed) setTimeout(scrollActiveIntoView, 300);
      else requestAnimationFrame(scrollActiveIntoView);
    }
  }

  function goPrevPage() {
    if (currentPageNum > 1) renderPage(currentPageNum - 1);
  }

  function goNextPage() {
    if (pdfDoc && currentPageNum < pdfDoc.numPages) {
      renderPage(currentPageNum + 1);
    }
  }

  /* ============ CHAPTERS ============ */
  function toggleChapter(idx, forceState) {
    const chEl = tocScroll.querySelector('.chapter[data-chapter-idx="' + idx + '"]');
    if (!chEl) return;

    let isCollapsed;
    if (forceState === 'open') isCollapsed = false;
    else if (forceState === 'close') isCollapsed = true;
    else isCollapsed = !collapsed.has(idx);

    if (isCollapsed) {
      collapsed.add(idx);
      chEl.classList.add('collapsed');
      chEl.querySelector('.chapter-head').setAttribute('aria-expanded', 'false');
    } else {
      collapsed.delete(idx);
      chEl.classList.remove('collapsed');
      chEl.querySelector('.chapter-head').setAttribute('aria-expanded', 'true');
    }
    saveCollapsed();
  }

  /* ============ SEARCH ============ */
  function filterTOC(query) {
    filteredQuery = query.trim();
    const q = filteredQuery.toLowerCase();

    if (!q) {
      tocScroll.classList.remove('searching', 'empty');
      tocScroll.querySelectorAll('.chapter').forEach(function (chEl) {
        const idx = Number(chEl.dataset.chapterIdx);
        chEl.style.display = '';
        chEl.querySelectorAll('.section-item').forEach(function (secEl) {
          secEl.style.display = '';
          const sec = BY_ID[secEl.dataset.id];
          secEl.querySelector('.section-title').innerHTML = escapeHtml(sec.title);
        });
        if (collapsed.has(idx)) chEl.classList.add('collapsed');
        else chEl.classList.remove('collapsed');
      });
      return;
    }

    tocScroll.classList.add('searching');
    let anyVisible = false;

    tocScroll.querySelectorAll('.chapter').forEach(function (chEl) {
      let visibleCount = 0;
      chEl.querySelectorAll('.section-item').forEach(function (secEl) {
        const sec = BY_ID[secEl.dataset.id];
        const matches = sec.title.toLowerCase().indexOf(q) !== -1;
        secEl.style.display = matches ? '' : 'none';
        if (matches) {
          visibleCount++;
          secEl.querySelector('.section-title').innerHTML = highlightMatch(sec.title, filteredQuery);
        }
      });
      chEl.style.display = visibleCount > 0 ? '' : 'none';
      chEl.classList.remove('collapsed');
      if (visibleCount > 0) anyVisible = true;
    });

    tocScroll.classList.toggle('empty', !anyVisible);
  }

  /* ============ EVENTS ============ */
  tocScroll.addEventListener('click', function (e) {
    const completeBtn = e.target.closest('.complete-btn');
    if (completeBtn) {
      e.preventDefault();
      e.stopPropagation();
      const item = completeBtn.closest('.section-item');
      if (item) toggleComplete(item.dataset.id);
      return;
    }

    const head = e.target.closest('.chapter-head');
    if (head) {
      if (filteredQuery) return;
      const chEl = head.closest('.chapter');
      toggleChapter(Number(chEl.dataset.chapterIdx));
      return;
    }

    const link = e.target.closest('.section-link');
    if (link) {
      e.preventDefault();
      const item = link.closest('.section-item');
      if (item) navigateTo(item.dataset.id);
    }
  });

  searchInput.addEventListener('input', function () { filterTOC(this.value); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
  });

  prevBtn.addEventListener('click', goPrevPage);
  nextBtn.addEventListener('click', goNextPage);
  backBtn.addEventListener('click', closePdfView);

  pdfCheckBtn.addEventListener('click', function () {
    if (activeId) toggleComplete(activeId);
  });

  pdfErrorBtn.addEventListener('click', function () {
    const page = (activeId && BY_ID[activeId].page) || 1;
    window.open(PDF_URL + '#page=' + page, '_blank', 'noopener');
  });

  function applyThemeColor() {
    if (!themeColorMeta) return;
    const isDark = document.documentElement.dataset.theme === 'dark';
    themeColorMeta.setAttribute('content', isDark ? '#131826' : '#ffffff');
  }

  themeToggle.addEventListener('click', function () {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(KEY_THEME, next); } catch (e) {}
    applyThemeColor();
  });

  expandAllBtn.addEventListener('click', function () {
    if (filteredQuery) return;
    TOC.forEach(function (_, idx) { toggleChapter(idx, 'open'); });
  });
  collapseAllBtn.addEventListener('click', function () {
    if (filteredQuery) return;
    TOC.forEach(function (_, idx) { toggleChapter(idx, 'close'); });
  });

  /* ============ KEYBOARD ============ */
  document.addEventListener('keydown', function (e) {
    const isInput = e.target.matches('input, textarea, [contenteditable]');

    if (e.key === '/' && !isInput) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
      return;
    }
    if (e.key === 'Escape') {
      if (document.activeElement === searchInput) {
        searchInput.value = '';
        filterTOC('');
        searchInput.blur();
        return;
      }
      if (app.classList.contains('pdf-open')) closePdfView();
      return;
    }
    if (!isInput) {
      if (e.key === '[') { e.preventDefault(); goPrevPage(); }
      if (e.key === ']') { e.preventDefault(); goNextPage(); }
    }
  });

  /* ============ RESIZE ============ */
  let resizeTimer;
  window.addEventListener('resize', function () {
    const wasMobile = isMobile;
    isMobile = window.matchMedia('(max-width: 860px)').matches;
    if (!isMobile && wasMobile) {
      app.classList.remove('pdf-open');
    }

    // Re-render PDF để fit width mới
    if (pdfDoc && currentPageNum) {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        renderPage(currentPageNum, { silent: true, scrollTop: false });
      }, 250);
    }
  });

  /* ============ INIT ============ */
  function init() {
    buildTOC();
    loadState();
    updateActiveUI();
    applyThemeColor();

    // Nếu pdf.js chưa load được từ CDN → hiện nút mở ngoài ngay
    if (typeof pdfjsLib === 'undefined') {
      showError('Không tải được thư viện PDF. Hãy kiểm tra kết nối mạng, hoặc dùng nút mở bằng ứng dụng khác.');
    }

    let lastId = null;
    try { lastId = localStorage.getItem(KEY_LAST); } catch (e) {}

    if (lastId && BY_ID[lastId]) {
      const sec = BY_ID[lastId];
      activeId = lastId;
      updateActiveUI();
      updateTopbar(sec);

      if (isMobile) {
        // Mobile: chỉ đánh dấu active, không tự mở PDF
      } else {
        // Desktop: render luôn
        renderPage(sec.page);
      }
    } else if (FLAT.length > 0) {
      const first = FLAT[0];
      activeId = first.id;
      updateActiveUI();
      updateTopbar(first);
      // Không tự render — đợi người dùng chọn
    }
  }

  init();
})();
</script>
